name: Decode trailhead JPEG
on:
  push:
    branches: [blog/finding-movement-trailhead-photo]
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64-encoded JPEG if needed
        run: |
          set -euo pipefail
          f=blog/images/finding-movement-trailhead.jpg
          python3 - <<'PY'
          import base64, sys
          from pathlib import Path
          p = Path("blog/images/finding-movement-trailhead.jpg")
          raw = p.read_bytes()
          if raw.startswith(b"\xff\xd8\xff"):
              print("already a jpeg", len(raw))
              sys.exit(0)
          data = base64.b64decode(raw, validate=False)
          if not data.startswith(b"\xff\xd8\xff"):
              sys.exit("decoded bytes are not a JPEG")
          p.write_bytes(data)
          print("decoded jpeg bytes", len(data))
          Path("/tmp/need_commit").write_text("1")
          PY
          if [ -f /tmp/need_commit ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$f"
            git commit -m "Store trailhead photo as a binary JPEG"
            git push
          fi
